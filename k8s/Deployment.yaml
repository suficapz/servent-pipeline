apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-servent
  labels:
    app: pipeline-servent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pipeline-servent
  template:
    metadata:
      labels:
        app: pipeline-servent
    spec:
      containers:
        - name: pipeline-servent
          image: muhammedsufiyan/pipeline-servent:3
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"